name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      - run: npm run compile

      - run: npx @vscode/vsce package

      # Immutable releases are sealed on publish and cannot receive assets afterward,
      # so the .vsix must be attached atomically at creation. Idempotent: if the release
      # was already created out-of-band, skip rather than fail.
      - name: Create release with .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases cannot receive late assets — skipping."
          else
            gh release create "$TAG" *.vsix --title "$TAG" --generate-notes
          fi

      # Publishes to the Open VSX Registry (VSCodium's marketplace). Skipped when the
      # OVSX_TOKEN secret is not set, so the workflow still succeeds without it.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_TOKEN != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_TOKEN"

      # Publishes to the VS Code Marketplace. Skipped when the VSCE_PAT secret is
      # not set, so the workflow still succeeds without it.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
